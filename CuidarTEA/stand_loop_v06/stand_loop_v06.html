<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CuidarTEA — Stand Loop V06 — Animatic</title>
  <link rel="stylesheet" href="stand_loop_v06.css">
</head>
<body>
  <main id="viewport" aria-label="Animatic V06 do Stand Loop CuidarTEA">
    <section id="stage" aria-live="off">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>
      <div class="ambient ambient-c"></div>
      <div class="ambient ambient-d"></div>
      <div class="human-tech-plate" aria-hidden="true"></div>
      <div class="tech-grid" aria-hidden="true"></div>

      <svg id="network" viewBox="0 0 1920 1080" aria-hidden="true">
        <path class="net-line line-a" pathLength="1"></path>
        <path class="net-line line-b" pathLength="1"></path>
        <path class="net-line line-c" pathLength="1"></path>
        <path class="net-line line-d" pathLength="1"></path>
        <path class="net-line line-e" pathLength="1"></path>
        <path class="net-line line-f" pathLength="1"></path>
        <path class="net-pulse pulse-a" pathLength="1"></path>
        <path class="net-pulse pulse-b" pathLength="1"></path>
        <path class="net-pulse pulse-c" pathLength="1"></path>
        <path class="net-pulse pulse-d" pathLength="1"></path>
        <path class="net-pulse pulse-e" pathLength="1"></path>
        <path class="net-pulse pulse-f" pathLength="1"></path>
        <g id="networkNodes"></g>
      </svg>

      <img id="brandBug" alt="CuidarTEA" src="assets/CuidarTEA_Typography_Personal_Logo.svg">
      <div id="systemLabel" aria-hidden="true"><i></i> REDE CUIDARTEA · SISTEMA CONECTADO</div>
      <div id="sceneLayer"></div>
      <div id="timelineRail" aria-hidden="true"><i></i></div>
    </section>
  </main>

  <aside id="controls" aria-label="Controles do animatic">
    <span id="animaticBadge">V06 · REVISÃO</span>
    <button id="playPause" type="button">Pausar</button>
    <button id="restart" type="button">Reiniciar</button>
    <input id="seek" type="range" min="0" max="55" step="0.01" value="0" aria-label="Tempo do animatic">
    <output id="time">00:00.00 / 00:55.00</output>
    <button id="fullscreen" type="button">Tela cheia</button>
  </aside>
  <p id="hint">Espaço: pausar · ←/→: 1 s · Shift + ←/→: 0,1 s · H: controles</p>

  <script src="stand_loop_v06.js"></script>
</body>
</html>
